name: 构建并推送镜像到 Docker Hub

# 触发方式：
#   1. 推送到 main      -> 打 main / latest 标签
#   2. 推送 v* 标签     -> 打 3.6.3 / 3.6 / 3 / latest 等语义化版本标签
#   3. 手动触发         -> 同上，按当前分支决定
#
# 需要仓库里配置两个 Secrets（Settings -> Secrets and variables -> Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（Access Token，不是登录密码）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一分支/标签的多次触发只保留最新一次，避免排队
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nameguoguo/webssh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # arm64 靠 QEMU 模拟构建，群晖 / 树莓派等 ARM 设备可以直接拉
      - name: 准备 QEMU 与 Buildx
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 版本号取自 package.json（check-version 门禁保证它与 tag 一致），
      # 这样推 main 分支也能产出 v3.6.3 这类版本标签，不必等打 tag。
      - name: 读取版本号
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

      - name: 计算标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.full }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=${{ steps.ver.outputs.major }}
            # 历史标签是 v3.1.0 / v2.0.0 这种带 v 前缀的，留一个 v 版本别名，
            # 免得按老习惯 docker pull ...:v3.6.3 拉不到
            type=raw,value=v${{ steps.ver.outputs.full }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关掉 provenance 证明：它会让镜像变成带 attestation 的 OCI index，
          # 群晖 / 群晖系 NAS 上较老的 docker 拉取时会报 unknown manifest。
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把仓库里的 DOCKERHUB.md 同步成 Docker Hub 上的仓库说明
      - name: 同步 Docker Hub 仓库说明
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKERHUB.md
          short-description: 浏览器里的全能 SSH 工作站：SSH 终端、SFTP、批量运维、远程桌面，一套代码覆盖 Web/桌面/移动/Docker
