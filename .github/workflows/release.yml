name: Build Desktop App
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.0'
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebSSH-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Generate icons
        run: npm run icons
      - name: Install electron deps and build
        run: |
          cd win
          npm install
          npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebSSH-portable
          path: release/WebSSH-portable.zip
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/WebSSH-portable.zip
