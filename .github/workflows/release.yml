name: Build Desktop App
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.0'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install electron deps and build
        run: |
          cd win
          npm install
          npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebSSH-portable
          path: release/WebSSH-portable.zip
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/WebSSH-portable.zip
