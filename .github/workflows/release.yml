name: Build All Platforms

# 打 tag（如 v3.0.0）或在 Actions 页面手动触发后，自动构建
# Windows 便携版 / macOS / Android APK / iOS（未签名）并附加到 GitHub Release。
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows 便携版（exe，免安装）──
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Generate icons
        run: npm run icons
      - name: Build portable exe
        run: |
          cd win
          npm install
          npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: webssh-win
          path: release/webssh-win.zip

  # ── macOS（dmg + zip，arm64 / x64）──
  # macos-13 is an Intel runner: hdiutil can create both HFS+/APFS DMGs there.
  # Newer macos-latest (arm64) runners hit a known electron-builder bug where
  # the x64 DMG step fails to `hdiutil detach` the shared /Volumes/WebSSH.
  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Electron dependencies
        run: cd win && npm install
      - name: Build dmg + zip
        env:
          # CI has no Apple certificates — never attempt identity discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -o pipefail
          npm run desktop:mac 2>&1 | tee mac-build.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: macos-failure-log
          path: mac-build.log
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: WebSSH-mac
          path: |
            release/*.dmg
            release/*.zip

  # ── Android APK（debug 签名，可直接安装）──
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Remove pre-compressed .gz files (vite emits them for web/CDN; Android would flag them as duplicate assets)
        run: node scripts/clean-android-assets.mjs
      - name: Generate launcher icons from logo.png
        run: npm run android:icons
      - name: Ensure Gradle wrapper downloads from the official URL
        # gradle-wrapper.properties 里目前是本机 file:/// 路径，CI 上动态纠正
        run: |
          sed -i 's|^distributionUrl=file:///.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: |
          set -o pipefail
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" 2>&1 | tee ../android-build.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-failure-log
          path: android-build.log
      - name: Rename artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WebSSH-android.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: WebSSH-android
          path: WebSSH-android.apk

  # ── iOS（未签名构建，供 Xcode 二次签名 / 越狱之外的分发需自行签名）──
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Sync Capacitor assets
        run: npx cap sync ios
      - name: Build with Xcode (unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
      - name: Package artifact
        run: |
          APP_PATH=$(find ios/App/build/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1 | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" WebSSH-ios-unsigned.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: WebSSH-ios
          path: WebSSH-ios-unsigned.zip

  # ── Docker 镜像构建自检（不推送；如需推送请另配凭据）──
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f docker/Dockerfile -t webssh:ci .

  # ── 汇总：把各端产物附加到 GitHub Release ──
  release:
    needs: [windows, macos, android, ios, docker]
    if: always() && (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts/
      - name: Create / update Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.apk
