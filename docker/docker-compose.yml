services:
  webssh:
    image: nameguoguo/webssh
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: webssh
    restart: unless-stopped
    read_only: true
    ports:
      - "9627:9627"
    environment:
      - PORT=9627
      # 后端访问密码：公网部署必填，自己定一个即可（详见 README「密码体系」）
      # - AUTH_TOKEN=你自己定的密码
      # - GUACD_HOST=guacd        # 启用 RDP/VNC（需 guacd 服务）
      # - DOCKER_SOCKET=/var/run/docker.sock  # 启用原生 Docker 管理
    volumes:
      # - /var/run/docker.sock:/var/run/docker.sock
      # 运行时数据（审计日志 / 服务器注册表 / TOFU 主机指纹）的实际写入目录
      - ./data:/app/core/server/data
    tmpfs:
      - /tmp
    healthcheck:
      test: curl -f http://localhost:9627/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3

  # guacd:  # RDP/VNC 远程桌面代理（取消上方 GUACD_HOST 注释后启用）
  #   image: guacamole/guacd
  #   container_name: guacd
  #   restart: unless-stopped
